[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "earthguardian"
version = "1.0.0"
description = "Environmental monitoring and irrigation intelligence for smallholder farms - LoRaWAN telemetry, FAO-56 water balance and a deterministic advisor, fully offline"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Thiago Roldan" }]
keywords = ["agriculture", "irrigation", "lorawan", "iot", "fao-56", "soil-moisture"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering",
]
dependencies = [
  "numpy>=1.26",
  "pandas>=2.1",
  "scipy>=1.11",
  "scikit-learn>=1.4",
  "joblib>=1.3",
  # The console's styling and its AppTest suite follow the markup of this release onwards.
  "streamlit>=1.61",
  "altair>=5.2",
  "typer>=0.12",
  "rich>=13.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "hypothesis>=6.100", "ruff>=0.5"]

[project.scripts]
earthguardian = "earthguardian.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["earthguardian*"]

[tool.setuptools.package-data]
# The console's typeface, served through Streamlit's static file support.
"earthguardian.dashboard" = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q --strict-markers"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
src = [".", "tests"]
line-length = 100
target-version = "py311"
extend-exclude = ["firmware/arduino_node"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "C4", "RUF", "ARG", "PTH"]
ignore = ["E501", "RUF001", "RUF003"]

[tool.ruff.lint.per-file-ignores]
# dict(a=1, b=2) reads better than a literal for keyword bundles.
"tests/*" = ["ARG", "C408"]
"earthguardian/cli.py" = ["B008"]
